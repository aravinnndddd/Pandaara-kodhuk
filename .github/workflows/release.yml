name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Standalone Executable (win-x64)
        shell: pwsh
        run: |
          $proj = if (Test-Path "./DigitalMosquito.csproj") { "./DigitalMosquito.csproj" } else { "./DigitalMosquito/DigitalMosquito.csproj" }
          dotnet publish $proj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./publish/DigitalMosquito-win-x64

      - name: Create Release Archive
        shell: pwsh
        run: |
          $publishDir = "./publish/DigitalMosquito-win-x64"
          $zipPath = "./DigitalMosquito-win-x64.zip"
          
          # Add README
          @"
          Pandaara കൊതുക് (Digital Mosquito)
          ===================================
          Double-click DigitalMosquito.exe to run!
          No installation or .NET runtime required.
          "@ | Out-File -FilePath "$publishDir/README.txt" -Encoding utf8

          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            DigitalMosquito-win-x64.zip
            ./publish/DigitalMosquito-win-x64/DigitalMosquito.exe
          draft: false
